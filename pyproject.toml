[project]
name = "object-detection-opencv-yolov8"
version = "0.1.0"
description = "Real-time object detection with OpenCV, YOLOv8, tracking, API, and dashboard."
requires-python = ">=3.9"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = false
disable_error_code = ["import-untyped", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
